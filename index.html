
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIDIMAN</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #151515;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow-x: hidden;
        }

        .fade-in {
            animation: fadeSlide 1.2s ease-out;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .page {
            position: relative;
            min-height: max(200vh, 1857px);
        }

        .background-collage {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-columns: repeat(8, minmax(0, 1fr));
            grid-auto-rows: 90px;
            gap: 3px;
            width: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .background-collage img {
            display: block;
            width: 100%;
            height: 100%;
            min-width: 0;
            object-fit: cover;
        }

        .dark-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: 1;
            pointer-events: none;
        }

        .website-content {
            position: relative;
            z-index: 2;
            color: white;
            padding: 100px 20px;
        }

        h1 {
            font-size: 60px;
            letter-spacing: 5px;
        }

        p {
            color: white;
        }

    </style>
</head>

<body>

    <div class="page">

        <div class="background-collage">

            <img src="images/Untitled design.png" alt="">
            <img src="images/Untitled design(1).png" alt="">
            <img src="images/Untitled design(2).png" alt="">
            <img src="images/Untitled design(3).png" alt="">
            <img src="images/Untitled design(4).png" alt="">
            <img src="images/Untitled design(5).png" alt="">
            <img src="images/Untitled design(6).png" alt="">
            <img src="images/Untitled design(7).png" alt="">
            <img src="images/Untitled design(8).png" alt="">
            <img src="images/Untitled design(9).png" alt="">
            <img src="images/Untitled design(10).png" alt="">
            <img src="images/Untitled design(11).png" alt="">

        </div>

        <div class="dark-overlay"></div>

        <main class="website-content">

            <h1 class="fade-in">MIDIMAN</h1>

            <p>Welcome to my corner of the internet.</p>

        </main>

    </div>

    <script>

        const collage = document.querySelector('.background-collage');

        // Collect the original 12 image paths
        const images = Array.from(collage.querySelectorAll('img'))
            .map(img => img.src);

        // Remove the original images
        collage.innerHTML = '';

        // Randomize an array
        function shuffle(array) {

            for (let i = array.length - 1; i > 0; i--) {

                const j = Math.floor(Math.random() * (i + 1));

                [array[i], array[j]] = [array[j], array[i]];

            }

            return array;
        }

        // Generate 160 randomized image tiles
        for (let i = 0; i < 160; i += 12) {

            const randomizedImages = shuffle([...images]);

            randomizedImages.forEach(src => {

                if (collage.children.length < 160) {

                    const img = document.createElement('img');

                    img.src = src;
                    img.alt = '';

                    collage.appendChild(img);

                }

            });

        }

        // Give each image independent random movement
        function animateImage(img) {

            const x = (Math.random() - 0.5) * 1200;
            const y = (Math.random() - 0.5) * 1200;

            const duration = 1000

            const animation = img.animate(

                [
                    {
                        transform: 'translate(0px, 0px)'
                    },

                    {
                        transform: `translate(${x}px, ${y}px)`
                    },

                    {
                        transform: 'translate(0px, 0px)'
                    }
                ],

                {
                    duration: duration,
                    easing: 'ease-in-out',
                    iterations: 1
                }

            );

            // When the image returns home, choose a new direction
            animation.onfinish = () => {

                animateImage(img);

            };

        }

        // Start each image at a different time
        document.querySelectorAll('.background-collage img')
            
            .forEach(img => {
                
                
                setTimeout(() => {

                    animateImage(img);

                }, Math.random() * 500);

            });

    </script>

</body>
</html>
